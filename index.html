<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0910">
<title>369 Manifestation</title>

<style>
:root{
  --bg:#0b0910;
  --bg2:#100d17;
  --panel:#17121f;
  --panel2:#1d1727;
  --panel3:#241c30;
  --gold:#f4c95d;
  --gold2:#ffd978;
  --purple:#9b6cff;
  --purple2:#7c4dff;
  --text:#f8f5ff;
  --muted:#aaa1b7;
  --line:#30273b;
  --success:#53d69b;
  --danger:#ff667f;
  --warning:#f4b942;
  --shadow:0 18px 50px rgba(0,0,0,.28);
  --radius:20px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Myanmar",
    "Myanmar Text",
    sans-serif;
  background:
    radial-gradient(circle at top right,rgba(155,108,255,.12),transparent 28%),
    radial-gradient(circle at bottom left,rgba(244,201,93,.07),transparent 25%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:260px;
  flex-shrink:0;
  background:rgba(15,11,21,.96);
  border-right:1px solid var(--line);
  padding:22px 15px;
  position:fixed;
  inset:0 auto 0 0;
  z-index:50;
  overflow-y:auto;
}

.brand{
  padding:5px 10px 25px;
}

.brand-icon{
  width:48px;
  height:48px;
  border-radius:15px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--gold),#a56cff);
  color:#140e1c;
  font-size:22px;
  font-weight:900;
  box-shadow:0 10px 30px rgba(244,201,93,.18);
  margin-bottom:12px;
}

.brand h1{
  font-size:22px;
  letter-spacing:.5px;
}

.brand p{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.nav-label{
  color:#766d82;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1.5px;
  padding:13px 12px 7px;
}

.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  color:#bdb5c7;
  padding:12px 13px;
  border-radius:13px;
  display:flex;
  align-items:center;
  gap:11px;
  text-align:left;
  margin-bottom:3px;
  transition:.2s;
}

.nav-btn:hover{
  background:#1b1524;
  color:white;
}

.nav-btn.active{
  color:#fff;
  background:linear-gradient(135deg,rgba(244,201,93,.14),rgba(155,108,255,.15));
  border:1px solid rgba(244,201,93,.18);
}

.nav-icon{
  width:25px;
  text-align:center;
  font-size:17px;
}

.main{
  width:calc(100% - 260px);
  margin-left:260px;
  min-height:100vh;
  padding-bottom:40px;
}

.topbar{
  height:72px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(11,9,16,.86);
  backdrop-filter:blur(16px);
}

.top-title{
  font-size:14px;
  color:var(--muted);
}

.top-date{
  font-size:13px;
  color:var(--gold2);
}

.content{
  max-width:1250px;
  margin:auto;
  padding:28px;
}

.view{
  display:none;
}

.view.active{
  display:block;
  animation:fadeIn .22s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:none}
}

.hero{
  background:
    radial-gradient(circle at 85% 20%,rgba(155,108,255,.24),transparent 28%),
    radial-gradient(circle at 20% 100%,rgba(244,201,93,.10),transparent 25%),
    linear-gradient(135deg,#191320,#120f18);
  border:1px solid var(--line);
  border-radius:26px;
  padding:28px;
  box-shadow:var(--shadow);
  margin-bottom:22px;
}

.hero-kicker{
  color:var(--gold);
  font-size:12px;
  font-weight:800;
  letter-spacing:1.2px;
  text-transform:uppercase;
}

.hero h2{
  font-size:clamp(27px,5vw,42px);
  line-height:1.08;
  margin:9px 0;
}

.hero p{
  color:var(--muted);
  max-width:720px;
  line-height:1.65;
}

.grid{
  display:grid;
  gap:16px;
}

.stats{
  grid-template-columns:repeat(4,1fr);
  margin-bottom:22px;
}

.card{
  background:linear-gradient(145deg,var(--panel),#120f18);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:0 12px 35px rgba(0,0,0,.14);
}

.stat-label{
  color:var(--muted);
  font-size:12px;
}

.stat-value{
  font-size:28px;
  font-weight:850;
  margin-top:7px;
}

.stat-sub{
  font-size:11px;
  color:#81788d;
  margin-top:4px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:25px 0 13px;
}

.section-head h3{
  font-size:18px;
}

.section-head p{
  color:var(--muted);
  font-size:12px;
}

.btn{
  border:1px solid var(--line);
  background:#1b1524;
  color:#eee;
  padding:10px 15px;
  border-radius:12px;
  font-weight:700;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:#4a3c59;
}

.btn.primary{
  background:linear-gradient(135deg,var(--gold),#dcae3e);
  color:#17100a;
  border:0;
}

.btn.purple{
  background:linear-gradient(135deg,var(--purple),var(--purple2));
  color:#fff;
  border:0;
}

.btn.success{
  background:rgba(83,214,155,.12);
  border-color:rgba(83,214,155,.3);
  color:var(--success);
}

.btn.danger{
  color:#ff8a9b;
  border-color:rgba(255,102,127,.22);
}

.btn.small{
  padding:8px 11px;
  font-size:12px;
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
  transform:none;
}

.progress-wrap{
  height:9px;
  border-radius:99px;
  background:#2a2232;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  background:linear-gradient(90deg,var(--purple),var(--gold));
  border-radius:99px;
  transition:.35s;
}

.day-progress{
  display:flex;
  align-items:center;
  gap:15px;
}

.day-progress .progress-wrap{
  flex:1;
}

.day-progress strong{
  white-space:nowrap;
}

.session-grid{
  grid-template-columns:repeat(3,1fr);
}

.session-card{
  position:relative;
  overflow:hidden;
}

.session-card.morning{
  border-top:3px solid #f4c95d;
}

.session-card.afternoon{
  border-top:3px solid #b985ff;
}

.session-card.evening{
  border-top:3px solid #7f69ff;
}

.session-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}

.session-name{
  font-size:18px;
  font-weight:850;
}

.session-time{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.count-badge{
  padding:7px 10px;
  border-radius:10px;
  background:#211a2c;
  color:var(--gold2);
  font-weight:800;
  font-size:12px;
}

.textarea,
.input,
.select{
  width:100%;
  background:#0f0c15;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px;
  outline:none;
  transition:.2s;
}

.textarea{
  resize:vertical;
  min-height:105px;
  line-height:1.55;
}

.input:focus,
.textarea:focus,
.select:focus{
  border-color:var(--purple);
  box-shadow:0 0 0 3px rgba(155,108,255,.08);
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  color:#b8afc1;
  font-size:12px;
  margin-bottom:7px;
}

.field-help{
  color:#746b80;
  font-size:10px;
  margin-top:5px;
}

.session-progress{
  margin:14px 0;
}

.session-progress-line{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:11px;
  margin-bottom:6px;
}

.session-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.reflection{
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--line);
}

.note-list{
  display:grid;
  gap:12px;
}

.note-item{
  background:#15111d;
  border:1px solid var(--line);
  border-radius:17px;
  padding:17px;
}

.note-item.favorite{
  border-color:rgba(244,201,93,.35);
}

.note-title-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.note-title{
  font-weight:800;
}

.note-text{
  color:#c4bccd;
  line-height:1.65;
  font-size:14px;
  margin:9px 0 13px;
  white-space:pre-wrap;
}

.note-meta{
  color:#777083;
  font-size:10px;
}

.note-actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:13px;
}

.two-col{
  grid-template-columns:1fr 1fr;
}

.library-grid{
  grid-template-columns:repeat(2,1fr);
}

.library-item{
  padding:18px;
  background:#15111d;
  border:1px solid var(--line);
  border-radius:17px;
}

.category{
  display:inline-block;
  font-size:10px;
  color:var(--gold2);
  background:rgba(244,201,93,.08);
  border:1px solid rgba(244,201,93,.15);
  padding:5px 8px;
  border-radius:8px;
  margin-bottom:10px;
}

.library-item p{
  color:#c6bfcc;
  line-height:1.6;
  font-size:14px;
}

.empty{
  text-align:center;
  padding:35px 20px;
  color:var(--muted);
  border:1px dashed #3a3045;
  border-radius:17px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:6px 9px;
  border-radius:9px;
  background:#211a2a;
  color:#bfb5ca;
  font-size:11px;
}

.badge.done{
  background:rgba(83,214,155,.1);
  color:var(--success);
}

.achievement-grid{
  grid-template-columns:repeat(3,1fr);
}

.achievement{
  text-align:center;
  padding:22px 15px;
}

.achievement-icon{
  width:58px;
  height:58px;
  border-radius:18px;
  margin:0 auto 12px;
  display:grid;
  place-items:center;
  font-size:25px;
  background:#211a2c;
  filter:grayscale(1);
  opacity:.45;
}

.achievement.unlocked .achievement-icon{
  background:linear-gradient(135deg,rgba(244,201,93,.2),rgba(155,108,255,.2));
  filter:none;
  opacity:1;
}

.achievement h4{
  font-size:14px;
}

.achievement p{
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
}

.chart-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin:13px 0;
}

.chart-label{
  width:95px;
  font-size:12px;
  color:#b8afc1;
}

.chart-row .progress-wrap{
  flex:1;
}

.chart-value{
  width:45px;
  text-align:right;
  font-size:12px;
  color:var(--gold2);
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:7px;
}

.cal-head{
  color:#746c7e;
  font-size:10px;
  text-align:center;
  padding:5px;
}

.cal-day{
  min-height:50px;
  border:1px solid var(--line);
  border-radius:11px;
  padding:7px;
  background:#14101b;
  position:relative;
}

.cal-day.empty-day{
  background:transparent;
  border-color:transparent;
}

.cal-day.complete{
  background:rgba(83,214,155,.09);
  border-color:rgba(83,214,155,.25);
}

.cal-day.today{
  border-color:var(--gold);
}

.cal-num{
  font-size:11px;
  color:#bbb2c2;
}

.cal-mark{
  position:absolute;
  right:6px;
  bottom:5px;
  color:var(--success);
  font-size:11px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.full{
  grid-column:1/-1;
}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(8px);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  background:#15111d;
  border:1px solid #3b3048;
  border-radius:24px;
  box-shadow:0 30px 90px rgba(0,0,0,.55);
  padding:22px;
}

.modal-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:15px;
  margin-bottom:17px;
}

.modal-head h3{
  font-size:21px;
}

.modal-head p{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.close-btn{
  width:35px;
  height:35px;
  border-radius:11px;
  border:1px solid var(--line);
  background:#201a29;
  color:#fff;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:15px;
}

.copy-box{
  background:#0f0c15;
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  margin-bottom:15px;
}

.copy-box p{
  color:#e8e2ed;
  line-height:1.7;
}

.copy-source{
  color:var(--gold);
  font-size:11px;
  margin-bottom:7px;
}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:200;
  background:#211a2b;
  color:#fff;
  border:1px solid #42344f;
  box-shadow:var(--shadow);
  border-radius:13px;
  padding:12px 15px;
  max-width:320px;
  transform:translateY(20px);
  opacity:0;
  pointer-events:none;
  transition:.25s;
  font-size:12px;
}

.toast.show{
  transform:none;
  opacity:1;
}

.mobile-nav{
  display:none;
}

.search-row{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.search-row .input{
  flex:1;
}

.list-stack{
  display:grid;
  gap:10px;
}

.check-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:15px 0;
  border-bottom:1px solid var(--line);
}

.check-row:last-child{
  border-bottom:0;
}

.switch{
  width:46px;
  height:26px;
  border-radius:99px;
  background:#312838;
  border:0;
  position:relative;
}

.switch::after{
  content:"";
  width:20px;
  height:20px;
  border-radius:50%;
  background:#aaa;
  position:absolute;
  top:3px;
  left:3px;
  transition:.2s;
}

.switch.on{
  background:var(--purple);
}

.switch.on::after{
  left:23px;
  background:#fff;
}

.lock-screen{
  position:fixed;
  inset:0;
  z-index:500;
  background:#0b0910;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.lock-screen.show{
  display:flex;
}

.lock-card{
  width:min(420px,100%);
  text-align:center;
  background:#17121f;
  border:1px solid var(--line);
  border-radius:25px;
  padding:30px;
}

.lock-icon{
  font-size:40px;
  margin-bottom:15px;
}

@media(max-width:1050px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .session-grid{
    grid-template-columns:1fr;
  }

  .achievement-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:780px){
  .sidebar{
    display:none;
  }

  .main{
    width:100%;
    margin-left:0;
    padding-bottom:85px;
  }

  .topbar{
    padding:0 16px;
    height:62px;
  }

  .content{
    padding:16px;
  }

  .hero{
    padding:22px;
    border-radius:21px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat-value{
    font-size:23px;
  }

  .two-col,
  .library-grid,
  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .mobile-nav{
    display:flex;
    position:fixed;
    left:10px;
    right:10px;
    bottom:10px;
    z-index:60;
    background:rgba(22,17,29,.95);
    backdrop-filter:blur(16px);
    border:1px solid #3a3044;
    border-radius:18px;
    padding:7px;
    justify-content:space-around;
    box-shadow:0 15px 45px rgba(0,0,0,.4);
  }

  .mobile-nav button{
    flex:1;
    border:0;
    background:transparent;
    color:#81788c;
    padding:8px 4px;
    border-radius:12px;
    font-size:10px;
  }

  .mobile-nav button.active{
    color:var(--gold2);
    background:#241c30;
  }

  .mobile-nav span{
    display:block;
    font-size:17px;
    margin-bottom:2px;
  }

  .calendar{
    gap:4px;
  }

  .cal-day{
    min-height:43px;
    padding:5px;
  }

  .achievement-grid{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:450px){
  .stats{
    grid-template-columns:1fr 1fr;
  }

  .hero h2{
    font-size:28px;
  }

  .session-actions .btn{
    flex:1;
  }
}

@media print{
  .sidebar,
  .topbar,
  .mobile-nav,
  .btn,
  .session-actions{
    display:none!important;
  }

  .main{
    width:100%;
    margin:0;
  }

  body{
    background:white;
    color:#111;
  }

  .card,
  .hero{
    box-shadow:none;
    border:1px solid #ccc;
    background:white;
    color:#111;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">369</div>
      <h1>369 Manifestation</h1>
      <p>Write It • Feel It • Believe It</p>
    </div>

    <div class="nav-label">Main</div>

    <button class="nav-btn active" data-view="dashboard">
      <span class="nav-icon">⌂</span> Dashboard
    </button>

    <button class="nav-btn" data-view="practice">
      <span class="nav-icon">✍</span> 369 Practice
    </button>

    <button class="nav-btn" data-view="notes">
      <span class="nav-icon">▤</span> My 369 Notes
    </button>

    <button class="nav-btn" data-view="library">
      <span class="nav-icon">◈</span> Manifest Library
    </button>

    <div class="nav-label">Journey</div>

    <button class="nav-btn" data-view="goals">
      <span class="nav-icon">◎</span> Goals
    </button>

    <button class="nav-btn" data-view="journal">
      <span class="nav-icon">☷</span> Notes & Reflections
    </button>

    <button class="nav-btn" data-view="progress">
      <span class="nav-icon">◒</span> Progress
    </button>

    <button class="nav-btn" data-view="achievements">
      <span class="nav-icon">◆</span> Achievements
    </button>

    <button class="nav-btn" data-view="history">
      <span class="nav-icon">◷</span> History
    </button>

    <div class="nav-label">More</div>

    <button class="nav-btn" data-view="guide">
      <span class="nav-icon">?</span> How It Works
    </button>

    <button class="nav-btn" data-view="settings">
      <span class="nav-icon">⚙</span> Settings
    </button>
  </aside>

  <main class="main">

    <header class="topbar">
      <div class="top-title" id="pageTitle">Dashboard</div>
      <div class="top-date" id="topDate"></div>
    </header>

    <div class="content">

      <!-- DASHBOARD -->
      <section class="view active" id="view-dashboard"></section>

      <!-- PRACTICE -->
      <section class="view" id="view-practice"></section>

      <!-- NOTES -->
      <section class="view" id="view-notes"></section>

      <!-- LIBRARY -->

<script>
"use strict";

/* =========================================================
   369 MANIFESTATION APP
   Version 5.2
   ========================================================= */

const STORAGE_KEY = "369_manifestation_v5_2";

const SESSION_CONFIG = {
  morning:{
    name:"Morning",
    icon:"🌅",
    target:3,
    time:"Morning • 3 times"
  },
  afternoon:{
    name:"Afternoon",
    icon:"☀️",
    target:6,
    time:"Afternoon • 6 times"
  },
  evening:{
    name:"Evening",
    icon:"🌙",
    target:9,
    time:"Evening • 9 times"
  }
};

const PAGE_TITLES = {
  dashboard:"Dashboard",
  practice:"369 Practice",
  notes:"My 369 Notes",
  library:"Manifest Library",
  goals:"Goals",
  journal:"Notes & Reflections",
  progress:"Progress",
  achievements:"Achievements",
  history:"History",
  guide:"How 369 Works",
  settings:"Settings"
};

const defaultState = {
  version:"5.2",
  notes:[],
  goals:[],
  practices:{},
  journals:{},
  settings:{
    reminder:false,
    language:"my",
    firstDay:"",
    lock:false,
    pin:""
  },
  selectedView:"dashboard"
};

let state = loadState();
let currentWriting = null;
let modalResolver = null;
let toastTimer = null;
let historyMonth = new Date().getMonth();
let historyYear = new Date().getFullYear();

function clone(obj){
  return JSON.parse(JSON.stringify(obj));
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);

    if(!raw){
      return clone(defaultState);
    }

    const parsed = JSON.parse(raw);

    return normalizeState(parsed);

  }catch(error){
    console.error(error);
    return clone(defaultState);
  }
}

function normalizeState(data){
  const s = Object.assign(clone(defaultState),data || {});

  if(!Array.isArray(s.notes)) s.notes = [];
  if(!Array.isArray(s.goals)) s.goals = [];
  if(!s.practices || typeof s.practices !== "object") s.practices = {};
  if(!s.journals || typeof s.journals !== "object") s.journals = {};
  if(!s.settings || typeof s.settings !== "object"){
    s.settings = clone(defaultState.settings);
  }

  Object.keys(SESSION_CONFIG).forEach(key=>{
    const d = s.practices[todayKey()];

    if(d){
      normalizePracticeDay(d);
    }
  });

  return s;
}

function save(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  }catch(error){
    console.error(error);
    showToast("Data save မအောင်မြင်ပါ");
  }
}

function todayKey(){
  const d = new Date();
  return dateKey(d);
}

function dateKey(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

function parseDate(key){
  const parts = key.split("-").map(Number);
  return new Date(parts[0],parts[1]-1,parts[2]);
}

function addDays(date,n){
  const d = new Date(date);
  d.setDate(d.getDate()+n);
  return d;
}

function formatDate(key){
  const d = parseDate(key);

  return new Intl.DateTimeFormat("en-US",{
    weekday:"short",
    month:"short",
    day:"numeric",
    year:"numeric"
  }).format(d);
}

function formatLongDate(){
  return new Intl.DateTimeFormat("en-US",{
    weekday:"long",
    month:"long",
    day:"numeric",
    year:"numeric"
  }).format(new Date());
}

function uid(prefix="id"){
  return prefix+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showToast(message){
  const el = document.getElementById("toast");

  el.textContent = message;
  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(()=>{
    el.classList.remove("show");
  },2600);
}

function navigate(view){
  if(!PAGE_TITLES[view]) return;

  state.selectedView = view;
  save();

  document.querySelectorAll(".view").forEach(el=>{
    el.classList.toggle("active",el.id === "view-"+view);
  });

  document.querySelectorAll("[data-view]").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.view === view);
  });

  document.getElementById("pageTitle").textContent = PAGE_TITLES[view];

  if(view === "history"){
    renderHistory();
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function createPracticeDay(){
  return {
    morning:{
      text:"",
      writings:[],
      note:"",
      completed:false
    },
    afternoon:{
      text:"",
      writings:[],
      note:"",
      completed:false
    },
    evening:{
      text:"",
      writings:[],
      note:"",
      completed:false
    },
    dailyNote:"",
    updatedAt:""
  };
}

function normalizePracticeDay(day){
  Object.keys(SESSION_CONFIG).forEach(key=>{
    if(!day[key]){
      day[key]={
        text:"",
        writings:[],
        note:"",
        completed:false
      };
    }

    if(!Array.isArray(day[key].writings)){
      day[key].writings=[];
    }

    day[key].text = String(day[key].text || "");
    day[key].note = String(day[key].note || "");

    const target = SESSION_CONFIG[key].target;

    if(day[key].writings.length >= target){
      day[key].writings = day[key].writings.slice(0,target);
      day[key].completed = true;
    }else{
      day[key].completed = false;
    }
  });

  day.dailyNote = String(day.dailyNote || "");
}

function getPracticeDay(key=todayKey()){
  if(!state.practices[key]){
    state.practices[key]=createPracticeDay();
    save();
  }

  normalizePracticeDay(state.practices[key]);

  return state.practices[key];
}

function sessionProgress(day,key){
  const target = SESSION_CONFIG[key].target;
  const current = Math.min(day[key].writings.length,target);

  return {
    current,
    target,
    percent:Math.round((current/target)*100),
    complete:current >= target
  };
}

function isDayComplete(key){
  const day = state.practices[key];

  if(!day) return false;

  return Object.keys(SESSION_CONFIG)
    .every(key=>sessionProgress(day,key).complete);
}

function completedDays(){
  return Object.keys(state.practices)
    .filter(isDayComplete)
    .sort();
}

function totalWritings(){
  return Object.values(state.practices)
    .reduce((total,day)=>{
      return total + Object.keys(SESSION_CONFIG)
        .reduce((sum,key)=>{
          return sum + (day[key]?.writings?.length || 0);
        },0);
    },0);
}

function currentStreak(){
  let d = new Date();

  if(!isDayComplete(dateKey(d))){
    d = addDays(d,-1);
  }

  let count = 0;

  while(isDayComplete(dateKey(d))){
    count++;
    d = addDays(d,-1);
  }

  return count;
}

function getTodayCompletion(){
  const day = getPracticeDay();

  let total = 0;

  Object.keys(SESSION_CONFIG).forEach(key=>{
    total += Math.min(
      day[key].writings.length,
      SESSION_CONFIG[key].target
    );
  });

  return {
    total,
    target:18,
    percent:Math.round((total/18)*100)
  };
}

function renderHistory(){
  const first = new Date(historyYear,historyMonth,1);
  const last = new Date(historyYear,historyMonth+1,0);

  const firstDay = first.getDay();
  const daysInMonth = last.getDate();

  const monthName = new Intl.DateTimeFormat("en-US",{
    month:"long",
    year:"numeric"
  }).format(first);

  let cells = "";

  for(let i=0;i<firstDay;i++){
    cells += `<div class="cal-day empty-day"></div>`;
  }

  for(let dayNum=1;dayNum<=daysInMonth;dayNum++){
    const key = dateKey(new Date(historyYear,historyMonth,dayNum));
    const complete = isDayComplete(key);
    const today = key === todayKey();

    cells += `
      <div class="cal-day ${complete ? "complete":""} ${today ? "today":""}">
        <div class="cal-num">${dayNum}</div>
        ${complete ? `<div class="cal-mark">✓</div>`:""}
      </div>
    `;
  }

  document.getElementById("view-history").innerHTML = `
    <div class="hero">
      <div class="hero-kicker">History</div>
      <h2>Your practice calendar</h2>
      <p>
        18/18 ပြည့်တဲ့နေ့တွေကို calendar မှာ ✓ နဲ့ပြထားပါတယ်
      </p>
    </div>

    <div class="card">
      <div class="section-head" style="margin-top:0">
        <button
          class="btn small"
          data-action="history-prev"
        >
          ←
        </button>

        <div style="text-align:center">
          <h3>${escapeHtml(monthName)}</h3>
        </div>

        <button
          class="btn small"
          data-action="history-next"
        >
          →
        </button>
      </div>

      <div class="calendar">
        <div class="cal-head">Sun</div>
        <div class="cal-head">Mon</div>
        <div class="cal-head">Tue</div>
        <div class="cal-head">Wed</div>
        <div class="cal-head">Thu</div>
        <div class="cal-head">Fri</div>
        <div class="cal-head">Sat</div>

        ${cells}
      </div>
    </div>
  `;
}

function saveWriting(){
  if(!currentWriting) return;

  const input = document.getElementById("writingInput");

  if(!input) return;

  const value = input.value.trim();

  if(!value){
    showToast("စာရေးပြီးမှ Complete လုပ်ပါ");
    return;
  }

  const day = getPracticeDay();
  const key = currentWriting.sessionKey;
  const session = day[key];
  const target = SESSION_CONFIG[key].target;

  if(session.writings.length >= target){
    closeModal();
    renderAll();
    return;
  }

  session.writings.push(value);

  if(session.writings.length >= target){
    session.completed = true;
  }

  day.updatedAt = new Date().toISOString();

  save();

  const complete = session.writings.length >= target;

  closeModal();

  if(complete){
    showToast(`${SESSION_CONFIG[key].name} session complete ✓`);
  }else{
    showToast(`Writing ${session.writings.length}/${target} saved`);
  }

  renderAll();

  if(complete && isDayComplete(todayKey())){
    setTimeout(()=>{
      showToast("🎉 Today 369 Complete — 18/18");
    },300);
  }
}

/* =========================================================
   EVENT ACTIONS
   ========================================================= */

document.addEventListener("click",function(e){

  const viewButton = e.target.closest("[data-view]");

  if(viewButton){
    navigate(viewButton.dataset.view);
    return;
  }

  const actionButton = e.target.closest("[data-action]");

  if(!actionButton) return;

  const action = actionButton.dataset.action;

  if(action === "go-practice"){
    navigate("practice");
    return;
  }

  if(action === "new-note"){
    openNoteModal();
    return;
  }

  if(action === "close-modal"){
    closeModal();
    return;
  }

  if(action === "save-note"){
    saveNote(actionButton.dataset.note || "");
    return;
  }

  if(action === "edit-note"){
    const note = state.notes.find(n=>n.id===actionButton.dataset.note);

    if(note) openNoteModal(note);

    return;
  }

  if(action === "delete-note"){
    deleteNote(actionButton.dataset.note);
    return;
  }

  if(action === "favorite-note"){
    toggleFavorite(actionButton.dataset.note);
    return;
  }

  if(action === "copy-note"){
    openCopyNoteModal(actionButton.dataset.note);
    return;
  }

  if(action === "copy-note-to-session"){
    copySelectedNoteToSession(actionButton.dataset.session);
    return;
  }

  if(action === "start-writing"){
    openWritingModal(actionButton.dataset.session);
    return;
  }

  if(action === "use-session-text"){
    const input = document.getElementById("writingInput");

    if(input && currentWriting){
      const day = getPracticeDay();
      input.value = day[currentWriting.sessionKey].text;
      input.focus();
    }

    return;
  }

  if(action === "complete-writing"){
    saveWriting();
    return;
  }

  if(action === "clear-session-writing"){
    clearSessionWriting(actionButton.dataset.session);
    return;
  }

  if(action === "save-daily-note"){
    saveDailyNote();
    return;
  }

  if(action === "save-library-note"){
    saveLibraryNote(
      actionButton.dataset.title,
      actionButton.dataset.text,
      actionButton.dataset.category
    );
    return;
  }

  if(action === "new-goal"){
    openGoalModal();
    return;
  }

  if(action === "goal-progress"){
    updateGoal(actionButton.dataset.goal);
    return;
  }

  if(action === "delete-goal"){
    deleteGoal(actionButton.dataset.goal);
    return;
  }

  if(action === "history-prev"){
    historyMonth--;

    if(historyMonth<0){
      historyMonth=11;
      historyYear--;
    }

    renderHistory();
    return;
  }

  if(action === "history-next"){
    historyMonth++;

    if(historyMonth>11){
      historyMonth=0;
      historyYear++;
    }

    renderHistory();
    return;
  }

  if(action === "toggle-reminder"){
    state.settings.reminder = !state.settings.reminder;
    save();
    renderSettings();
    showToast(
      state.settings.reminder
      ? "Reminder preference enabled"
      : "Reminder preference disabled"
    );
    return;
  }

  if(action === "export-data"){
    exportData();
    return;
  }

  if(action === "import-data"){
    importData();
    return;
  }

  if(action === "print"){
    window.print();
    return;
  }

  if(action === "reset-data"){
    resetData();
    return;
  }

});

/* =========================================================
   INPUT EVENTS

document.addEventListener("input",function(e){

  const sessionText = e.target.closest(".session-text");

  if(sessionText){

});

document.addEventListener("change",function(e){

    save();

    showToast("Language setting saved");
    return;
  }

});

document.getElementById("modalBackdrop").addEventListener("click",function(e){
  if(e.target === this){
    closeModal();
  }
});

/* =========================================================
   NOTES
   ========================================================= */

function saveNote(id){
  const title = document.getElementById("noteTitle")?.value.trim();
  const category = document.getElementById("noteCategory")?.value;
  const text = document.getElementById("noteText")?.value.trim();

  if(!title){
    showToast("Title ထည့်ပါ");
    return;
  }

  if(!text){
    showToast("Affirmation ထည့်ပါ");
    return;
  }

  if(id){
    const note = state.notes.find(n=>n.id===id);

    if(note){
      note.title = title;
      note.category = category;
      note.text = text;
      note.updatedAt = new Date().toISOString();
    }
  }else{
    state.notes.push({
      id:uid("note"),
      title,
      category,
      text,
      favorite:false,
      createdAt:new Date().toLocaleDateString()
    });
  }

  save();
  closeModal();
  renderAll();

  navigate("notes");

  showToast("Affirmation saved ✓");
}

function deleteNote(id){
  const note = state.notes.find(n=>n.id===id);

  if(!note) return;

  if(!confirm(`"${note.title}" ကိုဖျက်မလား`)){
    return;
  }

  state.notes = state.notes.filter(n=>n.id!==id);

  save();
  renderAll();
  navigate("notes");

  showToast("Note deleted");
}

function toggleFavorite(id){
  const note = state.notes.find(n=>n.id===id);

  if(!note) return;

  note.favorite = !note.favorite;

  save();
  renderNotes();

  showToast(
    note.favorite
    ? "Added to favorites"
    : "Removed from favorites"
  );
}

function openCopyNoteModal(noteId){
  const note = state.notes.find(n=>n.id===noteId);

  if(!note) return;

  openModal(`
    <div class="modal-head">
      <div>
        <h3>Copy Affirmation</h3>
        <p>${escapeHtml(note.title)}</p>
      </div>

      <button class="close-btn" data-action="close-modal">×</button>
    </div>

    <div class="copy-box">
      <div class="copy-source">SAVED AFFIRMATION</div>
      <p>${escapeHtml(note.text)}</p>
    </div>

    <div style="color:var(--muted);font-size:12px;margin-bottom:12px">
      ဘယ် session ထဲကို Copy လုပ်မလဲ
    </div>

    <div style="display:grid;gap:9px">

      <button
        class="btn primary"
        data-action="modal-copy-session"
        data-note="${escapeHtml(note.id)}"
        data-session="morning"
      >
        🌅 Copy to Morning • 3×
      </button>

      <button
        class="btn purple"
        data-action="modal-copy-session"
        data-note="${escapeHtml(note.id)}"
        data-session="afternoon"
      >
        ☀️ Copy to Afternoon • 6×
      </button>

      <button
        class="btn"
        data-action="modal-copy-session"
        data-note="${escapeHtml(note.id)}"
        data-session="evening"
      >
        🌙 Copy to Evening • 9×
      </button>

    </div>
  `);
}

document.addEventListener("click",function(e){

  const btn = e.target.closest("[data-action='modal-copy-session']");

  if(!btn) return;

  const note = state.notes.find(n=>n.id===btn.dataset.note);

  if(!note) return;

  const day = getPracticeDay();
  const key = btn.dataset.session;

  day[key].text = note.text;

  save();
  closeModal();
  renderAll();
  navigate("practice");

  showToast(`${SESSION_CONFIG[key].name} ထဲကို Copy လုပ်ပြီးပါပြီ ✓`);
});

function copySelectedNoteToSession(sessionKey){
  const select = document.querySelector(
    `[data-note-select="${sessionKey}"]`
  );

  if(!select || !select.value){
    showToast("အရင်ဆုံး saved affirmation ရွေးပါ");
    return;
  }

  const note = state.notes.find(n=>n.id===select.value);

  if(!note) return;

  const day = getPracticeDay();

  day[sessionKey].text = note.text;

  save();
  renderPractice();

  showToast(
    `${SESSION_CONFIG[sessionKey].name} affirmation copied ✓`
  );
}

function saveLibraryNote(title,text,category){
  const exists = state.notes.some(n=>n.text===text);

  if(exists){
    showToast("ဒီ affirmation ကို Notes ထဲမှာရှိပြီးသားပါ");
    return;
  }

  state.notes.push({
    id:uid("note"),
    title,
    category,
    text,
    favorite:false,
    createdAt:new Date().toLocaleDateString()
  });

  save();
  renderNotes();

  showToast("Added to My 369 Notes ✓");
}

/* =========================================================
   DAILY NOTES
   ========================================================= */

function saveDailyNote(){
  const day = getPracticeDay();

  const value =
    document.getElementById("dashboardDailyNote")?.value ??
    document.getElementById("practiceDailyNote")?.value ??
    document.getElementById("journalDailyNote")?.value;

  if(value === undefined) return;

  day.dailyNote = value;

  save();

  showToast("Reflection saved ✓");
}

/* =========================================================
   SESSION CLEAR
   ========================================================= */

function clearSessionWriting(key){
  const day = getPracticeDay();

  if(
    day[key].writings.length === 0 &&
    !day[key].text &&
    !day[key].note
  ){
    return;
  }

  if(!confirm(`${SESSION_CONFIG[key].name} session data ကို clear လုပ်မလား`)){
    return;
  }

  day[key] = {
    text:"",
    writings:[],
    note:"",
    completed:false
  };

  save();
  renderAll();
  navigate("practice");

  showToast(`${SESSION_CONFIG[key].name} cleared`);
}

/* =========================================================
   GOALS
   ========================================================= */

function openGoalModal(){
  openModal(`
    <div class="modal-head">
      <div>
        <h3>New Goal</h3>
        <p>Goal တစ်ခုဖန်တီးပါ</p>
      </div>

      <button class="close-btn" data-action="close-modal">×</button>
    </div>

    <div class="field">
      <label>Goal</label>
      <input
        class="input"
        id="goalTitle"
        placeholder="ဥပမာ — Monthly income target"
      >
    </div>

    <div class="modal-actions">
      <button class="btn" data-action="close-modal">Cancel</button>
      <button class="btn primary" data-action="save-goal">Save Goal</button>
    </div>
  `);
}

document.addEventListener("click",function(e){

  if(e.target.closest("[data-action='save-goal']")){
    const input = document.getElementById("goalTitle");

    if(!input || !input.value.trim()){
      showToast("Goal ထည့်ပါ");
      return;
    }

    state.goals.push({
      id:uid("goal"),
      title:input.value.trim(),
      progress:0,
      createdAt:new Date().toISOString()
    });

    save();
    closeModal();
    renderAll();
    navigate("goals");

    showToast("Goal created ✓");
  }

});

function updateGoal(id){
  const goal = state.goals.find(g=>g.id===id);

  if(!goal) return;

  goal.progress = Math.min(
    100,
    (Number(goal.progress)||0)+10
  );

  save();
  renderGoals();

  showToast(`Goal progress ${goal.progress}%`);
}

function deleteGoal(id){
  if(!confirm("ဒီ goal ကိုဖျက်မလား")) return;

  state.goals = state.goals.filter(g=>g.id!==id);

  save();
  renderGoals();

  showToast("Goal deleted");
}

/* =========================================================
   EXPORT / IMPORT
   ========================================================= */

function exportData(){
  try{
    const blob = new Blob(
      [JSON.stringify(state,null,2)],
      {type:"application/json"}
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;
    a.download =
      "369-manifestation-backup-" +
      todayKey() +
      ".json";

    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(url);

    showToast("Backup exported ✓");

  }catch(error){
    console.error(error);
    showToast("Export မအောင်မြင်ပါ");
  }
}

function importData(){
  const input = document.createElement("input");

  input.type = "file";
  input.accept = ".json,application/json";

  input.addEventListener("change",function(){

    const file = input.files?.[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(){

      try{
        const parsed = JSON.parse(reader.result);

        state = normalizeState(parsed);

        save();
        renderAll();

        showToast("Data imported ✓");

      }catch(error){
        console.error(error);
        showToast("Invalid JSON file");
      }

    };

    reader.readAsText(file);
  });

  input.click();
}

function resetData(){
  if(!confirm("App data အားလုံးကိုဖျက်မလား")) return;

  if(!confirm("ဒီလုပ်ဆောင်ချက်ကို ပြန် undo မလုပ်နိုင်ပါ")) return;

  state = clone(defaultState);

  save();
  renderAll();

  showToast("App reset complete");
}

renderAll();

getPracticeDay();
save();
