<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0910">
<title>369 — Manifestation & Mindset</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#09070d;
  --bg2:#100c16;
  --panel:#15111d;
  --panel2:#1b1625;
  --panel3:#211a2d;
  --gold:#f5c451;
  --gold2:#ffe29a;
  --purple:#9b6cff;
  --purple2:#c4a8ff;
  --text:#f8f5fc;
  --muted:#aaa2b5;
  --muted2:#766e82;
  --line:#2c2438;
  --success:#54d69b;
  --danger:#ff667d;
  --warning:#ffb84d;
  --radius:20px;
  --shadow:0 18px 45px rgba(0,0,0,.35);
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Myanmar",
    "Myanmar Text",
    sans-serif;
  background:
    radial-gradient(circle at 20% 0%,rgba(155,108,255,.12),transparent 28%),
    radial-gradient(circle at 90% 10%,rgba(245,196,81,.08),transparent 25%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

textarea,
input,
select{
  width:100%;
  color:var(--text);
  background:#0f0c15;
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px 14px;
  outline:none;
  transition:.2s;
}

textarea{
  resize:vertical;
  min-height:100px;
  line-height:1.6;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--purple);
  box-shadow:0 0 0 3px rgba(155,108,255,.12);
}

textarea::placeholder,
input::placeholder{
  color:#655d70;
}

.app{
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:260px;
  flex:0 0 260px;
  background:rgba(15,11,21,.96);
  border-right:1px solid var(--line);
  padding:22px 14px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:50;
  overflow-y:auto;
}

.brand{
  padding:4px 10px 22px;
}

.brand-mark{
  width:48px;
  height:48px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--gold),var(--purple));
  color:#110d16;
  font-weight:900;
  font-size:18px;
  margin-bottom:12px;
  box-shadow:0 10px 30px rgba(155,108,255,.22);
}

.brand h1{
  font-size:22px;
  letter-spacing:.5px;
}

.brand p{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.nav{
  display:grid;
  gap:5px;
}

.nav button{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px 13px;
  border-radius:13px;
  background:transparent;
  color:var(--muted);
  text-align:left;
  transition:.2s;
}

.nav button:hover{
  background:var(--panel2);
  color:var(--text);
}

.nav button.active{
  color:var(--gold2);
  background:linear-gradient(90deg,rgba(245,196,81,.13),rgba(155,108,255,.10));
  border:1px solid rgba(245,196,81,.12);
}

.nav-icon{
  width:23px;
  text-align:center;
}

.main{
  margin-left:260px;
  width:calc(100% - 260px);
  min-width:0;
}

.topbar{
  height:72px;
  border-bottom:1px solid var(--line);
  background:rgba(9,7,13,.72);
  backdrop-filter:blur(18px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:30;
}

.topbar-title{
  font-weight:800;
}

.topbar-date{
  color:var(--muted);
  font-size:12px;
}

.content{
  max-width:1400px;
  margin:auto;
  padding:28px;
  padding-bottom:100px;
}

.view{
  display:none;
  animation:fade .25s ease;
}

.view.active{
  display:block;
}

@keyframes fade{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:none}
}

.hero{
  padding:30px;
  border:1px solid var(--line);
  border-radius:28px;
  background:
    radial-gradient(circle at 85% 15%,rgba(245,196,81,.12),transparent 30%),
    radial-gradient(circle at 15% 80%,rgba(155,108,255,.13),transparent 35%),
    var(--panel);
  box-shadow:var(--shadow);
  margin-bottom:20px;
}

.eyebrow{
  color:var(--gold);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:2px;
  font-weight:800;
  margin-bottom:8px;
}

.hero h2{
  font-size:clamp(27px,4vw,42px);
  line-height:1.15;
  margin-bottom:10px;
}

.hero p{
  color:var(--muted);
  line-height:1.7;
  max-width:720px;
}

.grid{
  display:grid;
  gap:16px;
}

.grid-2{
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.grid-3{
  grid-template-columns:repeat(3,minmax(0,1fr));
}

.grid-4{
  grid-template-columns:repeat(4,minmax(0,1fr));
}

.card{
  background:linear-gradient(180deg,rgba(27,22,37,.98),rgba(18,14,25,.98));
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:0 12px 35px rgba(0,0,0,.18);
}

.card-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:15px;
}

.card-title{
  font-size:16px;
  font-weight:800;
}

.card-subtitle{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
  line-height:1.5;
}

.stat{
  position:relative;
  overflow:hidden;
}

.stat:after{
  content:"";
  position:absolute;
  width:80px;
  height:80px;
  border-radius:50%;
  background:rgba(155,108,255,.08);
  right:-25px;
  bottom:-25px;
}

.stat-label{
  color:var(--muted);
  font-size:12px;
}

.stat-value{
  font-size:28px;
  font-weight:900;
  margin-top:8px;
}

.stat-small{
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
}

.btn{
  min-height:42px;
  padding:10px 15px;
  border-radius:12px;
  background:var(--panel3);
  border:1px solid var(--line);
  color:var(--text);
  transition:.2s;
  font-weight:700;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:#493b5c;
}

.btn-primary{
  color:#18120a;
  background:linear-gradient(135deg,var(--gold),#ffe3a0);
  border-color:transparent;
}

.btn-purple{
  background:linear-gradient(135deg,#8b5cf6,#b795ff);
  color:white;
  border-color:transparent;
}

.btn-success{
  background:rgba(84,214,155,.12);
  border-color:rgba(84,214,155,.25);
  color:var(--success);
}

.btn-danger{
  color:#ff8b9c;
  background:rgba(255,102,125,.08);
  border-color:rgba(255,102,125,.2);
}

.btn-small{
  min-height:34px;
  padding:7px 10px;
  font-size:12px;
}

.btn-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.session-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
}

.session{
  position:relative;
  overflow:hidden;
}

.session.morning{
  border-top:3px solid #f5c451;
}

.session.afternoon{
  border-top:3px solid #9b6cff;
}

.session.evening{
  border-top:3px solid #c98cff;
}

.session-label{
  display:flex;
  align-items:center;
  gap:10px;
}

.session-icon{
  width:40px;
  height:40px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(245,196,81,.1);
}

.afternoon .session-icon{
  background:rgba(155,108,255,.12);
}

.evening .session-icon{
  background:rgba(201,140,255,.12);
}

.target-badge{
  margin-left:auto;
  padding:6px 9px;
  border-radius:999px;
  background:var(--panel3);
  color:var(--gold2);
  font-size:11px;
  font-weight:800;
}

.progress-wrap{
  margin:15px 0;
}

.progress-info{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:11px;
  margin-bottom:7px;
}

.progress{
  height:8px;
  background:#0c0911;
  border-radius:999px;
  overflow:hidden;
}

.progress > span{
  display:block;
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--gold),var(--purple));
  transition:.3s;
}

.session textarea{
  min-height:105px;
}

.reflection{
  margin-top:12px;
}

.reflection label,
.field label{
  display:block;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  margin-bottom:7px;
}

.session-actions{
  display:flex;
  gap:7px;
  margin-top:12px;
  flex-wrap:wrap;
}

.note-list{
  display:grid;
  gap:12px;
}

.note-item{
  padding:16px;
  background:rgba(10,8,14,.65);
  border:1px solid var(--line);
  border-radius:16px;
}

.note-item.favorite{
  border-color:rgba(245,196,81,.3);
}

.note-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.note-title{
  font-weight:800;
}

.note-category{
  display:inline-flex;
  margin-top:6px;
  padding:4px 8px;
  border-radius:999px;
  background:rgba(155,108,255,.1);
  color:var(--purple2);
  font-size:10px;
}

.note-text{
  color:#e6e0eb;
  line-height:1.7;
  margin-top:12px;
  white-space:pre-wrap;
}

.note-actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:13px;
}

.empty{
  padding:30px 15px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--line);
  border-radius:16px;
}

.section-title{
  font-size:25px;
  margin-bottom:5px;
}

.section-desc{
  color:var(--muted);
  margin-bottom:20px;
  line-height:1.6;
}

.search{
  margin-bottom:15px;
}

.goal-item{
  padding:16px;
  border:1px solid var(--line);
  background:#100d16;
  border-radius:16px;
  margin-bottom:10px;
}

.goal-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.goal-name{
  font-weight:800;
}

.goal-value{
  color:var(--gold);
  font-weight:800;
}

.goal-bar{
  margin-top:12px;
}

.badges{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}

.badge{
  text-align:center;
  padding:18px 10px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#100d16;
  opacity:.42;
}

.badge.unlocked{
  opacity:1;
  border-color:rgba(245,196,81,.3);
  background:linear-gradient(180deg,rgba(245,196,81,.08),#100d16);
}

.badge-icon{
  font-size:28px;
  margin-bottom:8px;
}

.badge-title{
  font-size:12px;
  font-weight:800;
}

.badge-desc{
  color:var(--muted);
  font-size:10px;
  line-height:1.4;
  margin-top:4px;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:5px;
}

.calendar-head{
  text-align:center;
  color:var(--muted);
  font-size:10px;
  padding:5px;
}

.day{
  min-height:52px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#100d16;
  padding:7px;
  position:relative;
  font-size:11px;
}

.day.empty-day{
  opacity:.25;
}

.day.complete{
  border-color:rgba(84,214,155,.35);
  background:rgba(84,214,155,.08);
}

.day.partial{
  border-color:rgba(245,196,81,.3);
  background:rgba(245,196,81,.05);
}

.day-number{
  font-weight:800;
}

.day-count{
  color:var(--muted);
  font-size:9px;
  margin-top:7px;
}

.quote{
  padding:20px;
  border-left:3px solid var(--gold);
  background:rgba(245,196,81,.05);
  border-radius:0 14px 14px 0;
  line-height:1.8;
  color:#eee7f3;
}

.steps{
  display:grid;
  gap:12px;
}

.step{
  display:flex;
  gap:12px;
}

.step-num{
  flex:0 0 32px;
  width:32px;
  height:32px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(155,108,255,.12);
  color:var(--purple2);
  font-weight:900;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:12px;
}

.divider{
  height:1px;
  background:var(--line);
  margin:18px 0;
}

.switch-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px 0;
  border-bottom:1px solid var(--line);
}

.switch{
  width:48px;
  height:27px;
  background:#292331;
  border-radius:999px;
  padding:3px;
  transition:.2s;
}

.switch span{
  display:block;
  width:21px;
  height:21px;
  border-radius:50%;
  background:#81788d;
  transition:.2s;
}

.switch.on{
  background:rgba(245,196,81,.25);
}

.switch.on span{
  transform:translateX(21px);
  background:var(--gold);
}

.toast{
  position:fixed;
  right:18px;
  bottom:20px;
  z-index:200;
  padding:13px 16px;
  border-radius:13px;
  background:#211a2d;
  border:1px solid #453653;
  box-shadow:var(--shadow);
  color:white;
  transform:translateY(20px);
  opacity:0;
  pointer-events:none;
  transition:.25s;
  max-width:320px;
  font-size:13px;
}

.toast.show{
  opacity:1;
  transform:none;
}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(7px);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  background:#15111d;
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:0 30px 90px rgba(0,0,0,.55);
  padding:22px;
}

.modal-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.modal-title{
  font-size:20px;
  font-weight:900;
}

.close{
  width:36px;
  height:36px;
  border-radius:10px;
  background:var(--panel3);
  color:var(--text);
}

.modal-actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:15px;
}

.mobile-nav{
  display:none;
}

.mobile-nav button{
  background:transparent;
  color:var(--muted);
  font-size:10px;
}

.mobile-nav button.active{
  color:var(--gold);
}

.mobile-nav .nav-icon{
  display:block;
  font-size:19px;
  margin-bottom:2px;
  width:auto;
}

.kpi-big{
  font-size:42px;
  font-weight:950;
  background:linear-gradient(135deg,var(--gold2),var(--purple2));
  -webkit-background-clip:text;
  color:transparent;
}

.session-preview{
  padding:12px;
  border-radius:12px;
  background:#0f0c15;
  border:1px solid var(--line);
  color:#dcd4e4;
  font-size:12px;
  line-height:1.6;
  margin-top:10px;
  min-height:65px;
}

.select-note{
  margin-top:9px;
}

.copy-list{
  display:grid;
  gap:8px;
  margin-top:10px;
}

.copy-option{
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0f0c15;
  cursor:pointer;
}

.copy-option:hover{
  border-color:var(--purple);
}

.timer{
  text-align:center;
  padding:25px;
}

.timer-value{
  font-size:65px;
  font-weight:900;
  color:var(--gold);
}

@media(max-width:1100px){
  .grid-4{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .session-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:800px){
  .sidebar{
    display:none;
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .topbar{
    height:62px;
    padding:0 16px;
  }

  .content{
    padding:18px 14px 90px;
  }

  .hero{
    padding:22px;
  }

  .grid-2,
  .grid-3,
  .grid-4{
    grid-template-columns:1fr;
  }

  .badges{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .mobile-nav{
    position:fixed;
    left:10px;
    right:10px;
    bottom:10px;
    z-index:60;
    height:64px;
    border:1px solid var(--line);
    border-radius:20px;
    background:rgba(20,16,27,.95);
    backdrop-filter:blur(20px);
    display:grid;
    grid-template-columns:repeat(5,1fr);
    align-items:center;
    box-shadow:0 15px 45px rgba(0,0,0,.45);
  }

  .mobile-nav button{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100%;
  }

  .calendar{
    gap:3px;
  }

  .day{
    min-height:45px;
    padding:5px;
  }

  .day-count{
    font-size:8px;
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark">369</div>
    <h1>369</h1>
    <p>Write It • Feel It • Believe It</p>
  </div>

  <nav class="nav">
    <button data-view="dashboard" class="active"><span class="nav-icon">⌂</span>Dashboard</button>
    <button data-view="practice"><span class="nav-icon">✍</span>369 Practice</button>
    <button data-view="notes"><span class="nav-icon">📝</span>My 369 Notes</button>
    <button data-view="library"><span class="nav-icon">✨</span>Manifest Library</button>
    <button data-view="builder"><span class="nav-icon">⚡</span>Manifest Builder</button>
    <button data-view="goals"><span class="nav-icon">🎯</span>My Goals</button>
    <button data-view="journey"><span class="nav-icon">🧭</span>My Journey</button>
    <button data-view="progress"><span class="nav-icon">📊</span>Progress</button>
    <button data-view="achievements"><span class="nav-icon">🏆</span>Achievements</button>
    <button data-view="gratitude"><span class="nav-icon">🙏</span>Gratitude</button>
    <button data-view="visualization"><span class="nav-icon">👁</span>Visualization</button>
    <button data-view="journal"><span class="nav-icon">📔</span>Journal</button>
    <button data-view="history"><span class="nav-icon">📅</span>History</button>
    <button data-view="guide"><span class="nav-icon">❔</span>How 369 Works</button>
    <button data-view="settings"><span class="nav-icon">⚙</span>Settings</button>
  </nav>
</aside>

<main class="main">

<header class="topbar">
  <div>
    <div class="topbar-title" id="topTitle">Dashboard</div>
    <div class="topbar-date" id="topDate"></div>
  </div>

  <button class="btn btn-small btn-primary" data-view="practice">
    ✍ Start 369
  </button>
</header>

<div class="content">

<!-- DASHBOARD -->
<section id="view-dashboard" class="view active"></section>

<!-- PRACTICE -->
<section id="view-practice" class="view"></section>

<!-- NOTES -->
<section id="view-notes" class="view"></section>

<!-- LIBRARY -->
<section id="view-library" class="view"></section>

<!-- BUILDER -->
<section id="view-builder" class="view"></section>

<!-- GOALS -->
<section id="view-goals" class="view"></section>

<!-- JOURNEY -->
<section id="view-journey" class="view"></section>

<!-- PROGRESS -->
<section id="view-progress" class="view"></section>

<!-- ACHIEVEMENTS -->
<section id="view-achievements" class="view"></section>

<!-- GRATITUDE -->

<script>
"use strict";

/* =========================================================
   369 V5.1
   Notes -> Copy -> Morning 3 / Afternoon 6 / Evening 9
   ========================================================= */

const STORAGE_KEY = "369_manifest_app_v5_1";

const SESSION_CONFIG = {
  morning:{
    label:"Morning",
    my:"မနက်ပိုင်း",
    icon:"🌅",
    target:3,
    className:"morning"
  },
  afternoon:{
    label:"Afternoon",
    my:"နေ့လယ်ပိုင်း",
    icon:"☀️",
    target:6,
    className:"afternoon"
  },
  evening:{
    label:"Evening",
    my:"ညပိုင်း",
    icon:"🌙",
    target:9,
    className:"evening"
  }
};

const VIEW_TITLES = {
  dashboard:"Dashboard",
  practice:"369 Practice",
  notes:"My 369 Notes",
  library:"Manifest Library",
  builder:"Manifest Builder",
  goals:"My Goals",
  journey:"My Journey",
  progress:"Progress",
  achievements:"Achievements",
  gratitude:"Gratitude",
  visualization:"Visualization",
  journal:"Journal",
  history:"History",
  guide:"How 369 Works",
  settings:"Settings"
};

const DEFAULT_STATE = {
  version:"5.1",
  notes:[],
  selectedNoteId:null,
  practices:{},
  goals:[],
  gratitude:{},
  journal:{},
  vision:{
    vision:"",
    futureSelf:""
  },
  settings:{
    language:"my",
    reminder:false,
    journeyStart:"",
    theme:"dark"
  }
};

let state = loadState();
let currentView = "dashboard";
let currentDate = todayKey();
let activeWriting = null;
let visualizationTimer = null;
let toastTimer = null;

function clone(obj){
  return JSON.parse(JSON.stringify(obj));
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);

    if(!raw){
      return clone(DEFAULT_STATE);
    }

    const parsed = JSON.parse(raw);

    return normalizeState(parsed);
  }catch(err){
    console.error(err);
    return clone(DEFAULT_STATE);
  }
}

function normalizeState(s){
  const base = clone(DEFAULT_STATE);

  if(!s || typeof s !== "object"){
    return base;
  }

  base.version = "5.1";

  if(Array.isArray(s.notes)){
    base.notes = s.notes.map(n => ({
      id:String(n.id || uid()),
      title:String(n.title || "My Affirmation"),
      category:String(n.category || "Personal"),
      text:String(n.text || ""),
      favorite:Boolean(n.favorite),
      createdAt:n.createdAt || new Date().toISOString(),
      updatedAt:n.updatedAt || n.createdAt || new Date().toISOString()
    })).filter(n => n.text.trim());
  }

  base.selectedNoteId = s.selectedNoteId || null;

  if(s.practices && typeof s.practices === "object"){
    base.practices = s.practices;
  }

  if(Array.isArray(s.goals)){
    base.goals = s.goals;
  }

  if(s.gratitude && typeof s.gratitude === "object"){
    base.gratitude = s.gratitude;
  }

  if(s.journal && typeof s.journal === "object"){
    base.journal = s.journal;
  }

  if(s.vision && typeof s.vision === "object"){
    base.vision = {
      vision:String(s.vision.vision || ""),
      futureSelf:String(s.vision.futureSelf || "")
    };
  }

  if(s.settings && typeof s.settings === "object"){
    base.settings = {
      ...base.settings,
      ...s.settings
    };
  }

  return base;
}

function save(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  }catch(err){
    console.error(err);
    showToast("Data save မအောင်မြင်ပါ");
  }
}

function uid(){
  return Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);
}

function todayKey(date=new Date()){
  const y=date.getFullYear();
  const m=String(date.getMonth()+1).padStart(2,"0");
  const d=String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

function parseDate(key){
  const [y,m,d]=key.split("-").map(Number);
  return new Date(y,m-1,d);
}

function addDays(date,n){
  const d=new Date(date);
  d.setDate(d.getDate()+n);
  return d;
}

function formatDate(key){
  try{
    return new Intl.DateTimeFormat("my-MM",{
      weekday:"short",
      year:"numeric",
      month:"long",
      day:"numeric"
    }).format(parseDate(key));
  }catch(e){
    return key;
  }
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function getPractice(dateKey=currentDate){
  if(!state.practices[dateKey]){
    state.practices[dateKey] = {
      morning:{
        text:"",
        writings:[],
        note:"",
        completed:false
      },
      afternoon:{
        text:"",
        writings:[],
        note:"",
        completed:false
      },
      evening:{
        text:"",
        writings:[],
        note:"",
        completed:false
      },
      dailyNote:"",
      updatedAt:new Date().toISOString()
    };
  }

  const p=state.practices[dateKey];

  Object.keys(SESSION_CONFIG).forEach(key=>{
    if(!p[key]){
      p[key]={
        text:"",
        writings:[],
        note:"",
        completed:false
      };
    }

    if(!Array.isArray(p[key].writings)){
      p[key].writings=[];
    }

    if(typeof p[key].text!=="string"){
      p[key].text="";
    }

    if(typeof p[key].note!=="string"){
      p[key].note="";
    }

    p[key].completed =
      p[key].writings.length >= SESSION_CONFIG[key].target;
  });

  if(typeof p.dailyNote!=="string"){
    p.dailyNote="";
  }

  return p;
}

function sessionProgress(dateKey,key){
  const p=getPractice(dateKey)[key];
  const target=SESSION_CONFIG[key].target;
  return Math.min(p.writings.length,target);
}

function dayTotal(dateKey){
  const p=getPractice(dateKey);

  return Object.keys(SESSION_CONFIG)
    .reduce((sum,key)=>sum+sessionProgress(dateKey,key),0);
}

function isDayComplete(dateKey){
  return Object.keys(SESSION_CONFIG)
    .every(key=>sessionProgress(dateKey,key)===SESSION_CONFIG[key].target);
}

function completedDays(){
  return Object.keys(state.practices)
    .filter(k=>isDayComplete(k))
    .length;
}

function totalWritings(){
  return Object.keys(state.practices).reduce((sum,date)=>{
    const p=getPractice(date);

    return sum+
      p.morning.writings.length+
      p.afternoon.writings.length+
      p.evening.writings.length;
  },0);
}

function currentStreak(){
  let d=parseDate(todayKey());
  let key=todayKey();

  if(!isDayComplete(key)){
    d=addDays(d,-1);
  }

  let count=0;

  while(true){
    key=todayKey(d);

    if(!isDayComplete(key)) break;

    count++;
    d=addDays(d,-1);

    if(count>5000) break;
  }

  return count;
}

function longestStreak(){
  const dates=Object.keys(state.practices)
    .filter(isDayComplete)
    .sort();

  let longest=0;
  let run=0;
  let previous=null;

  dates.forEach(key=>{
    if(previous){
      const diff=(parseDate(key)-parseDate(previous))/86400000;

      if(diff===1){
        run++;
      }else{
        run=1;
      }
    }else{
      run=1;
    }

    longest=Math.max(longest,run);
    previous=key;
  });

  return longest;
}

function showToast(message){
  const el=document.getElementById("toast");

  clearTimeout(toastTimer);

  el.textContent=message;
  el.classList.add("show");

  toastTimer=setTimeout(()=>{
    el.classList.remove("show");
  },2600);
}

function setView(view){
  if(!VIEW_TITLES[view]) return;

  currentView=view;

  document.querySelectorAll(".view").forEach(v=>{
    v.classList.toggle("active",v.id==="view-"+view);
  });

  document.querySelectorAll("[data-view]").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.view===view);
  });

  document.getElementById("topTitle").textContent=VIEW_TITLES[view];

  renderView(view);

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function renderView(view){
  switch(view){
    case"dashboard":renderDashboard();break;
    case"practice":renderPractice();break;
    case"notes":renderNotes();break;
    case"library":renderLibrary();break;
    case"builder":renderBuilder();break;
    case"goals":renderGoals();break;
    case"journey":renderJourney();break;
    case"progress":renderProgress();break;
    case"achievements":renderAchievements();break;
    case"gratitude":renderGratitude();break;
    case"visualization":renderVisualization();break;
    case"journal":renderJournal();break;
    case"history":renderHistory();break;
    case"guide":renderGuide();break;
    case"settings":renderSettings();break;
  }
}

function renderNotes(){

  const filtered=state.notes
    .filter(n=>
      !query ||

      n.category.toLowerCase().includes(query)
    )

        </div>

        <div class="field" style="margin-top:12px">

function renderProgress(){

  let elapsed=now.getDate();
  let completedThisMonth=0;

  for(let i=1;i<=elapsed;i++){

    if(isDayComplete(key)) completedThisMonth++;

function recentActivity(){
  const dates=Object.keys(state.practices)
    .sort()
    .reverse()
    .slice(0,8);

  if(!dates.length){
    return `<div class="empty">Activity မရှိသေးပါ</div>`;
  }

  return dates.map(date=>{
    const p=getPractice(date);
    const total=dayTotal(date);

    return `
      <div class="note-item">
        <div class="note-top">
          <strong>${escapeHtml(formatDate(date))}</strong>
          <span class="target-badge">${total}/18</span>
        </div>

        <div class="muted small" style="margin-top:8px">
          Morning ${p.morning.writings.length}/3 ·
          Afternoon ${p.afternoon.writings.length}/6 ·
          Evening ${p.evening.writings.length}/9
        </div>
      </div>
    `;
  }).join("");
}

function renderHistory(){
  const now=new Date();
  const year=window.historyYear ?? now.getFullYear();
  const month=window.historyMonth ?? now.getMonth();

  const first=new Date(year,month,1);
  const last=new Date(year,month+1,0);
  const startDay=first.getDay();

  const monthName=new Intl.DateTimeFormat("my-MM",{
    month:"long",
    year:"numeric"
  }).format(first);

  let cells="";

  for(let i=0;i<startDay;i++){
    cells+=`<div class="day empty-day"></div>`;
  }

  for(let d=1;d<=last.getDate();d++){
    const key=todayKey(new Date(year,month,d));
    const count=dayTotal(key);

    let cls="";

    if(count===18) cls="complete";
    else if(count>0) cls="partial";

    cells+=`
      <div class="day ${cls}">
        <div class="day-number">${d}</div>
        <div class="day-count">${count}/18</div>
      </div>
    `;
  }

  document.getElementById("view-history").innerHTML=`
    <div class="section-title">History</div>
    <div class="section-desc">ဘယ်နေ့တွေမှာ practice ပြီးခဲ့လဲ ကြည့်ပါ</div>

    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-title">${escapeHtml(monthName)}</div>
          <div class="card-subtitle">Green = Complete · Gold = Partial</div>
        </div>

        <div class="btn-row">
          <button class="btn btn-small" data-action="history-prev">‹</button>
          <button class="btn btn-small" data-action="history-today">Today</button>
          <button class="btn btn-small" data-action="history-next">›</button>
        </div>
      </div>

      <div class="calendar">
        ${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`
          <div class="calendar-head">${x}</div>
        `).join("")}
        ${cells}
      </div>
    </div>
  `;
}

function closeModal(){
  document.getElementById("modalBackdrop").classList.remove("show");
  document.getElementById("modal").innerHTML="";
  activeWriting=null;
}

function completeWriting(){
  if(!activeWriting) return;

  const input=document.getElementById("writingInput");

  if(!input) return;

  const value=input.value.trim();

  if(!value){
    showToast("Affirmation ကို ပြန်ရေးပါ");
    return;
  }

  const {sessionKey,dateKey}=activeWriting;
  const c=SESSION_CONFIG[sessionKey];
  const p=getPractice(dateKey);
  const s=p[sessionKey];

  if(s.writings.length>=c.target){
    closeModal();
    return;
  }

  if(value!==s.text.trim()){
    const ok=confirm(
      "သင်ရေးထားတဲ့စာက saved affirmation နဲ့ မတူပါ\n\n" +
      "ဒီစာကိုပဲ သိမ်းမလား?"
    );

    if(!ok) return;
  }

  s.writings.push(value);
  s.completed=s.writings.length>=c.target;

  p.updatedAt=new Date().toISOString();

  save();

  const count=s.writings.length;

  if(count>=c.target){
    closeModal();
    showToast(`${c.label} ${c.target} writings ပြီးပါပြီ ✓`);

    if(isDayComplete(dateKey)){
      setTimeout(()=>{
        showToast("🎉 Today 369 — 18/18 Complete!");
      },700);
    }
  }else{
    openWriting(sessionKey);
  }

  renderView(currentView);
}

function useNote(noteId,sessionKey){
  const note=state.notes.find(n=>n.id===noteId);

  if(!note) return;

  const p=getPractice(currentDate);
  const s=p[sessionKey];

  if(s.writings.length>0 && s.text.trim()!==note.text.trim()){
    const ok=confirm(
      "ဒီ session မှာ writing တွေရှိပြီးသားပါ\n" +
      "Affirmation ပြောင်းလိုက်ရင် လက်ရှိ writings တွေ reset ဖြစ်ပါမယ်\n\n" +
      "ဆက်လုပ်မလား?"
    );

    if(!ok) return;

    s.writings=[];
    s.completed=false;
  }

  s.text=note.text;

  state.selectedNoteId=note.id;

  save();

  showToast(`${SESSION_CONFIG[sessionKey].label} အတွက် affirmation ထည့်ပြီးပါပြီ`);

  renderView(currentView);
}

function exportText(){

  output+="====================\n\n";

  state.notes.forEach((n,i)=>{
    output+=`${i+1}. ${n.title}\n`;
    output+=`Category: ${n.category}\n`;
    output+=`${n.text}\n\n`;
  });

  output+="PRACTICE HISTORY\n";
  output+="====================\n\n";

  Object.keys(state.practices)
    .sort()
    .reverse()
    .forEach(date=>{
      const p=getPractice(date);

      output+=`${date} — ${dayTotal(date)}/18\n`;
      output+=`Morning: ${p.morning.text}\n`;
      output+=`Afternoon: ${p.afternoon.text}\n`;
      output+=`Evening: ${p.evening.text}\n`;
      output+=`Daily Note: ${p.dailyNote}\n\n`;
    });

  const blob=new Blob([output],{type:"text/plain;charset=utf-8"});

  downloadBlob(blob,`369-journal-${todayKey()}.txt`);
}

function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download=name;

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function handleImport(file){
  if(!file) return;

  const reader=new FileReader();

  reader.onload=()=>{
    try{
      const imported=JSON.parse(reader.result);

      state=normalizeState(imported);

      save();

      renderView(currentView);

      showToast("Backup imported ✓");
    }catch(err){
      console.error(err);
      showToast("JSON file မမှန်ပါ");
    }
  };

  reader.readAsText(file);
}

function resetAll(){
  if(!confirm("369 app data အားလုံးကို ဖျက်မလား?")) return;

  if(!confirm("ဒီလုပ်ဆောင်ချက်ကို ပြန်ပြင်လို့မရပါ")) return;

  state=clone(DEFAULT_STATE);

  save();

  currentDate=todayKey();

  renderView(currentView);

  showToast("All data reset");
}

function startTimer(seconds){
  clearInterval(visualizationTimer);

  let remaining=seconds;

  const el=document.getElementById("timerValue");

  if(el) el.textContent=remaining;

  visualizationTimer=setInterval(()=>{
    remaining--;

    const target=document.getElementById("timerValue");

    if(target){
      target.textContent=remaining;
    }

    if(remaining<=0){
      clearInterval(visualizationTimer);
      showToast("Visualization session complete ✨");
    }
  },1000);
}

function stopTimer(){
  clearInterval(visualizationTimer);

  const el=document.getElementById("timerValue");

  if(el) el.textContent="60";
}

function speak(text){
  if(!("speechSynthesis" in window)){
    showToast("ဒီ device မှာ Voice မရပါ");
    return;
  }

  speechSynthesis.cancel();

  const u=new SpeechSynthesisUtterance(text);

  u.lang="my-MM";
  u.rate=.85;

  speechSynthesis.speak(u);
}

document.addEventListener("click",e=>{
  const viewBtn=e.target.closest("[data-view]");

  if(viewBtn){
    setView(viewBtn.dataset.view);
    return;
  }

  const actionEl=e.target.closest("[data-action]");

  if(!actionEl) return;

  const action=actionEl.dataset.action;

  switch(action){

    case"add-note":
      addNote();
      break;

    case"clear-note-form":
      document.getElementById("noteTitle").value="";
      document.getElementById("noteText").value="";
      break;

    case"note-copy":{
      const note=state.notes.find(n=>n.id===actionEl.dataset.id);

      if(note){
        state.selectedNoteId=note.id;
        save();

        if(navigator.clipboard){
          navigator.clipboard.writeText(note.text)
            .then(()=>showToast("Affirmation copied ✓"))
            .catch(()=>showToast("Note selected ✓"));
        }else{
          showToast("Note selected ✓");
        }

        renderNotes();
      }
      break;
    }

    case"note-use-morning":
      useNote(actionEl.dataset.id,"morning");
      break;

    case"note-use-afternoon":
      useNote(actionEl.dataset.id,"afternoon");
      break;

    case"note-use-evening":
      useNote(actionEl.dataset.id,"evening");
      break;

    case"favorite-note":{
      const note=state.notes.find(n=>n.id===actionEl.dataset.id);

      if(note){
        note.favorite=!note.favorite;
        save();
        renderNotes();
      }

      break;
    }

    case"edit-note":
      editNote(actionEl.dataset.id);
      break;

    case"save-edit-note":
      saveEditedNote(actionEl.dataset.id);
      break;

    case"delete-note":
      deleteNote(actionEl.dataset.id);
      break;

    case"open-writing":
      openWriting(actionEl.dataset.session);
      break;

    case"close-modal":
      closeModal();
      break;

    case"fill-writing":{
      if(!activeWriting) break;

      const p=getPractice(activeWriting.dateKey);
      const text=p[activeWriting.sessionKey].text;

      const input=document.getElementById("writingInput");

      if(input){
        input.value=text;
        input.focus();
      }

      break;
    }

    case"speak-writing":{
      if(!activeWriting) break;

      const p=getPractice(activeWriting.dateKey);
      speak(p[activeWriting.sessionKey].text);
      break;
    }

    case"complete-writing":
      completeWriting();
      break;

    case"use-selected-note":{
      const session=actionEl.dataset.session;
      const select=document.querySelector(
        `select[data-action="copy-note-select"][data-session="${session}"]`
      );

      if(!select || !select.value){
        showToast("အရင်ဆုံး Note ရွေးပါ");
        return;
      }

      useNote(select.value,session);
      break;
    }

    case"copy-selected-note":{
      if(state.selectedNoteId){
        useNote(state.selectedNoteId,actionEl.dataset.session);
      }
      break;
    }

    case"reset-session":{
      const session=actionEl.dataset.session;

      if(!confirm(`${SESSION_CONFIG[session].label} writings reset လုပ်မလား?`)){
        return;
      }

      const p=getPractice(currentDate);

      p[session].writings=[];
      p[session].completed=false;

      save();
      renderView(currentView);

      showToast("Session reset");
      break;
    }

    case"copy-note-select":
      break;

    case"library-save":{
      const item=window.manifestLibrary?.[Number(actionEl.dataset.index)];

      if(!item) break;

      const note={
        id:uid(),
        title:item[0],
        category:item[1],
        text:item[2],
        favorite:false,
        createdAt:new Date().toISOString(),
        updatedAt:new Date().toISOString()
      };

      state.notes.push(note);
      state.selectedNoteId=note.id;

      save();

      showToast("Saved to My Notes ✓");
      break;
    }

    case"library-use":{
      const item=window.manifestLibrary?.[Number(actionEl.dataset.index)];

      if(!item) break;

      const p=getPractice(currentDate);

      p.morning.text=item[2];

      save();

      showToast("Morning အတွက် affirmation ထည့်ပြီးပါပြီ");

      setView("practice");
      break;
    }

    case"build-manifest":{
      const want=document.getElementById("builderWant").value.trim();
      const feel=document.getElementById("builderFeel").value.trim();
      const why=document.getElementById("builderWhy").value.trim();

      if(!want){
        showToast("What do you want? ဖြည့်ပါ");
        return;
      }

      let result=
        `ကျွန်တော်/ကျွန်မ ${want} ကို တန်ဖိုးရှိစွာ ရရှိခံစားနေပြီး `+
        `${feel || "ယုံကြည်မှုနဲ့ စိတ်အေးချမ်းမှု"} နဲ့ နေ့စဉ်ရှေ့ဆက်နေပါတယ်`;

      if(why){
        result+=` ${why} အတွက် ကျေးဇူးတင်ရှိပါတယ်`;
      }

      window.builderResult=result;

      document.getElementById("builderResult").textContent=result;

      const saveBtn=document.querySelector("[data-action='save-builder']");

      if(saveBtn){
        saveBtn.disabled=false;
      }

      break;
    }

    case"save-builder":
      saveBuilder();
      break;

    case"add-goal":
      addGoal();
      break;

    case"goal-plus":{
      const g=state.goals.find(x=>x.id===actionEl.dataset.id);

      if(g){
        g.current=Math.min(g.target,g.current+(g.target*.1));
        save();
        renderGoals();
      }

      break;
    }

    case"delete-goal":
      state.goals=state.goals.filter(
        x=>x.id!==actionEl.dataset.id
      );

      save();
      renderGoals();
      break;

    case"toggle-reminder":
      state.settings.reminder=!state.settings.reminder;
      save();
      renderSettings();
      showToast(
        state.settings.reminder
        ?"Reminder preference ON"
        :"Reminder preference OFF"
      );
      break;

    case"export-json":
      exportJSON();
      break;

    case"export-text":
      exportText();
      break;

    case"print":
      window.print();
      break;

    case"import-json":
      importJSON();
      break;

    case"reset-all":
      resetAll();
      break;

    case"history-prev":
      window.historyMonth=(window.historyMonth ?? new Date().getMonth())-1;
      if(window.historyMonth<0){
        window.historyMonth=11;
        window.historyYear=(window.historyYear ?? new Date().getFullYear())-1;
      }
      renderHistory();
      break;

    case"history-next":
      window.historyMonth=(window.historyMonth ?? new Date().getMonth())+1;
      if(window.historyMonth>11){
        window.historyMonth=0;
        window.historyYear=(window.historyYear ?? new Date().getFullYear())+1;
      }
      renderHistory();
      break;

    case"history-today":{
      const now=new Date();
      window.historyYear=now.getFullYear();
      window.historyMonth=now.getMonth();
      renderHistory();
      break;
    }

    case"start-timer":
      startTimer(Number(actionEl.dataset.seconds));
      break;

    case"stop-timer":
      stopTimer();
      break;
  }
});

document.getElementById("modalBackdrop").addEventListener("click",e=>{
  if(e.target.id==="modalBackdrop"){
    closeModal();
  }
});

document.addEventListener("change",e=>{
  const el=e.target;

  if(el.matches("[data-action='copy-note-select']")){
    const session=el.dataset.session;

    if(el.value){
      useNote(el.value,session);
    }
  }
});

document.getElementById("importFile")?.addEventListener("change",e=>{
  handleImport(e.target.files[0]);
  e.target.value="";
});

function init(){
  currentDate=todayKey();

  document.getElementById("topDate").textContent=formatDate(currentDate);

  getPractice(currentDate);

  save();

  renderView("dashboard");
}

init();

</script>
